params:
    author: rooyca

    defaultTheme: dark
    disableThemeToggle: true
    ShowShareButtons: true
    ShowReadingTime: true
    ShowWordCount: true
    displayFullLangName: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowToc: true
    DateFormat: "2 Jan 2006"
    hideAuthor: true
    #comments: true
    disableAckee: true
    ShowRssButtonInSectionTermList: true
    description: "This blog's purpose is to share things I've learned, projects I've done and, in general, things that I find interesting."

    keywords: 
      - "ideas"
      - "tutorials"
      - "projects"
      - "programming"
      - "technology"
      - "development"
      - "blogging"
      - "notes"

    mainSections:
      - articles

    socialIcons:
        - name: github
          url: "https://github.com/rooyca"
        - name: twitter
          url: "https://twitter.com/rooycaa"
        # - name: telegram
        #   url: "https://t.me/user"
        - name: mastodon
          url: "https://mas.to/@rooyca"
        #- name: keybase
        #  url: "https://keybase.io/rooyca"
        - name: hackerrank
          url: "https://www.hackerrank.com/rooyca"
        #- name: kofi
        #  url: "https://ko-fi.com/rooyca"
